name: Windows build

# Builds the desktop app and the installer on a real Windows machine, then
# boots the packaged executable and probes its dashboard. A green unit-test
# suite proves the code is correct; only this proves the *bundle* is -- that
# PyInstaller actually collected uvicorn's protocol modules, the dashboard's
# static files and the config template.

on:
  workflow_dispatch:
  push:
    branches: [ "arena/**" ]
    paths:
      - "omega/**"
      - "config/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller==6.11.1
          # Windows-only, so it can only be installed here. If the bundled
          # app is ever pointed at a real terminal, this is what talks to it.
          pip install MetaTrader5

      - name: Run the test suite
        shell: pwsh
        # Failures are echoed back as workflow annotations as well as log
        # lines: the raw logs live behind a storage host that is not always
        # reachable, but annotations come back over the plain REST API.
        run: |
          pytest -q --tb=line -p no:randomly 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $interesting = $out |
              Where-Object { $_ -match "(?i)^(FAILED|ERROR)|short test summary|^E |Error: |\.py:\d+:" } |
              Select-Object -Last 9
            foreach ($line in $interesting) {
              $clean = ($line -replace "`r", "").Trim()
              if ($clean) { Write-Host "::error::$clean" }
            }
            exit $code
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Build the executable
        run: pyinstaller packaging/windows/omega.spec --noconfirm --clean

      - name: Self-test the packaged app
        shell: pwsh
        # The real test: launch the frozen exe exactly as a user would, let
        # it bring up the trader and the web server, and probe the HTTP API.
        run: |
          $env:OMEGA_HOME = "$env:RUNNER_TEMP\omega-selftest"
          & "dist\OmegaTrader\OmegaTrader.exe" --selftest --no-browser 2>&1 |
            Tee-Object -Variable out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Annotations are capped per level per step, and an exception
            # chain buries its root cause at the top while the symptom sits
            # at the bottom. Report both ends, in different buckets.
            $head = $out |
              Where-Object { "$_" -match "(?i)error|cannot|failed|DLL|No module" } |
              Select-Object -First 8
            foreach ($line in $head) {
              $clean = ("$line" -replace "`r", "").Trim()
              if ($clean) { Write-Host "::error::ROOT $clean" }
            }
            foreach ($line in ($out | Select-Object -Last 8)) {
              $clean = ("$line" -replace "`r", "").Trim()
              if ($clean) { Write-Host "::warning::TAIL $clean" }
            }
            Write-Host "::error::packaged app failed its self-test (exit $code)"
            exit 1
          }

      - name: Show what actually landed in the bundle
        if: failure()
        shell: pwsh
        # When an import fails inside the bundle, the first question is
        # always whether the package is in there at all.
        run: |
          foreach ($pkg in @("numpy", "pandas", "uvicorn", "omega")) {
            $hit = Get-ChildItem -Path "dist\OmegaTrader\_internal" -Filter $pkg -Recurse -Directory -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) {
              $n = (Get-ChildItem $hit.FullName -Recurse -File).Count
              Write-Host "::error::BUNDLE $pkg -> $($hit.FullName) ($n files)"
            } else {
              Write-Host "::error::BUNDLE $pkg -> MISSING"
            }
          }
          $dlls = (Get-ChildItem "dist\OmegaTrader\_internal" -Filter "*.dll" -File -ErrorAction SilentlyContinue).Count
          Write-Host "::error::BUNDLE top-level dlls: $dlls"

      - name: Check first run created a usable settings folder
        shell: pwsh
        run: |
          $home_dir = "$env:RUNNER_TEMP\omega-selftest"
          foreach ($f in @("config.yaml", "logs", "data")) {
            if (-not (Test-Path "$home_dir\$f")) {
              Write-Error "first run did not create $f"
              exit 1
            }
            Write-Host "ok: $f"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Verify the installer runs silently and the app launches
        shell: pwsh
        # /VERYSILENT with a per-user install needs no elevation, so the
        # whole install -> launch -> uninstall cycle is exercised in CI.
        run: |
          $setup = (Get-ChildItem dist\OmegaTrader-Setup-*.exe)[0].FullName
          $target = "$env:RUNNER_TEMP\OmegaTraderInstalled"
          Start-Process -FilePath $setup -Wait -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/CURRENTUSER", "/DIR=$target", "/TASKS="
          )
          $exe = "$target\OmegaTrader.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "installer did not place OmegaTrader.exe in $target"
            exit 1
          }
          $env:OMEGA_HOME = "$env:RUNNER_TEMP\omega-installed-home"
          & $exe --selftest --no-browser
          if ($LASTEXITCODE -ne 0) {
            Write-Error "installed app failed its self-test"
            exit 1
          }
          Write-Host "installed build self-tested cleanly"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: OmegaTrader-Setup-${{ steps.version.outputs.version }}
          path: dist/OmegaTrader-Setup-*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload the portable folder
        uses: actions/upload-artifact@v4
        with:
          name: OmegaTrader-portable-${{ steps.version.outputs.version }}
          path: dist/OmegaTrader/
          if-no-files-found: error
          retention-days: 30

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OmegaTrader-Setup-*.exe
