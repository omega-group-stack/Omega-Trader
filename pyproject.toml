[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-trader"
version = "1.0.0"
description = "Professional multi-indicator automated Forex trading bot for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
omega = "omega.cli:main"

[tool.setuptools.packages.find]
include = ["omega*"]

[tool.setuptools.package-data]
"omega.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
